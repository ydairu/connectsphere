name: CI

# Runs code checks, Firestore emulator tests and browser tests in independent jobs.
# Nothing here needs Firebase credentials: the live API harness (test:api:live) is opt-in.
# E2E uses an in-memory Firebase double; transaction tests use a local Firestore emulator.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_checks:
    name: Lint, unit and integration tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Existing shared, backend and frontend suites
        run: npm run test:existing

      - name: Unit and integration suites with coverage (all stories)
        run: npm run test:coverage

      - name: Frontend production build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14
          if-no-files-found: ignore

  firestore_emulator:
    name: Firestore emulator transactions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Java for local Firestore concurrency checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Booking transactions against Firestore emulator (SPM-14)
        run: npx --yes --package=firebase-tools@15.34.0 firebase emulators:exec --only firestore --project demo-connectsphere-bookings --config firebase.spm14.json "npm run test:spm14:emulator"

      - name: Venue booking approval transactions (SPM-54)
        run: npx --yes --package=firebase-tools@15.34.0 firebase emulators:exec --only firestore --project demo-connectsphere-spm54 --config tests/spm-54/firebase.emulator.json "npm run test:spm54:emulator"

      - name: Equipment reservation transactions (SPM-58)
        run: npx --yes --package=firebase-tools@15.34.0 firebase emulators:exec --only firestore --project demo-connectsphere-bookings --config firebase.spm14.json "npm run test:spm58:emulator"

      - name: Venue hold expiry transactions (SPM-78)
        run: npx --yes --package=firebase-tools@15.34.0 firebase emulators:exec --only firestore --project demo-connectsphere-spm78 --config firebase.spm14.json "npm run test:spm78:emulator"

      - name: Multiple venue booking transactions (SPM-79)
        run: npx --yes --package=firebase-tools@15.34.0 firebase emulators:exec --only firestore --project demo-connectsphere-spm79 --config firebase.spm14.json "npm run test:spm79:emulator"

      - name: Individual venue cancellation against Firestore emulator (SPM-81)
        run: npx --yes --package=firebase-tools@15.34.0 firebase emulators:exec --only firestore --project demo-connectsphere-spm81 --config firebase.spm14.json "npm run test:spm81:emulator"

      - name: Upload booking emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-emulator-results
          path: test-results/spm14-emulator.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload equipment reservation emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-reservation-emulator-results
          path: test-results/spm58-emulator.json
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end suites (all stories)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
